<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanizTori</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="لینک دسترسی های سریع شبکه های اجتماعی دنیزطوری">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Lalezar&family=Racing+Sans+One&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Ambient Engine Sound (Optional, requires user interaction to play) -->
    <audio id="engineSound" src="https://actions.google.com/sounds/v1/transportation/motorcycle_start_and_idle.ogg" preload="auto"></audio>
    <audio id="revSound" src="https://actions.google.com/sounds/v1/transportation/motorcycle_pass_by.ogg" preload="auto"></audio>

    <div class="carbon-bg"></div>
    <div class="vignette"></div>

    <main class="dashboard-container">
        
        <!-- Header Profile -->
        <header class="profile-header">
            <h1 class="profile-title" dir="ltr" style="font-family: 'Racing Sans One', cursive; font-size: 3.5rem; letter-spacing: 2px;">DanizTori <i class="fa-solid fa-motorcycle accent-icon" style="margin-left: 10px;"></i></h1>
            <p class="profile-bio">زندگی روی دو چرخ. مرزها رو بشکن و گاز بده!</p>
        </header>

        <!-- Speedometer Section (Central Hub) -->
        <section class="speedometer-wrapper">
            <div class="speedometer-inner">
                <!-- SVG Speedometer Design -->
                <svg class="speed-dial" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
                            <stop offset="70%" style="stop-color:#333;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ff1744;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    
                    <!-- Outer Ring -->
                    <circle cx="100" cy="100" r="95" fill="none" stroke="#222" stroke-width="10"/>
                    
                    <!-- Track -->
                    <path d="M 30,170 A 90,90 0 1,1 170,170" fill="none" stroke="url(#gradRed)" stroke-width="8" stroke-linecap="round"/>
                    
                    <!-- RPM Progress (Dynamic) -->
                    <path id="rpmPath" d="M 30,170 A 90,90 0 1,1 170,170" fill="none" stroke="#ff1744" stroke-width="8" stroke-linecap="round" stroke-dasharray="415" stroke-dashoffset="415"/>
                    
                    <!-- Ticks -->
                    <g class="ticks" stroke="#666" stroke-width="2">
                        <!-- Ticks generated in JS for precision, or approximated here -->
                        <line x1="20" y1="160" x2="30" y2="155" />
                        <line x1="10" y1="100" x2="20" y2="100" />
                        <line x1="50" y1="25" x2="55" y2="35" />
                        <line x1="100" y1="10" x2="100" y2="20" />
                        <line x1="150" y1="25" x2="145" y2="35" />
                        <line x1="190" y1="100" x2="180" y2="100" />
                        <line x1="180" y1="160" x2="170" y2="155" stroke="#ff1744" stroke-width="3"/>
                    </g>
                </svg>

                <div class="speed-data">
                    <div class="speed-value" id="speedValue">0</div>
                    <div class="speed-unit">km/h</div>
                </div>

                <div class="gear-indicator">
                    <span id="gearValue">N</span>
                </div>

                <!-- Ignition Key (Secret Game Button) -->
                <div class="ignition-key" id="ignitionKey" title="استارت (بازی مخفی)">
                    <i class="fa-solid fa-key"></i>
                </div>
            </div>

            <!-- Game Overlay (Hidden by default, shown inside speedometer area) -->
            <div class="game-display" id="gameDisplay">
                <canvas id="gameCanvas" width="300" height="300"></canvas>
                <div class="game-controls-ui" id="gameControlsUI">
                    <button id="leftBtn" class="game-btn"><i class="fa-solid fa-arrow-left"></i></button>
                    <button id="rightBtn" class="game-btn"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
                <div class="game-overlay-ui" id="gameOverUI">
                    <h3>تصادف کردی!</h3>
                    <p>امتیاز: <span id="finalScore">0</span></p>
                    <button id="restartBtn">دوباره</button>
                    <button id="exitGameBtn2" class="exit-btn">خروج</button>
                </div>
                <div class="game-start-ui" id="gameStartUI">
                    <p>با دکمه‌های چپ و راست جاخالی بده!</p>
                    <button id="playBtn">شروع بازی</button>
                    <button id="exitGameBtn1" class="exit-btn">خروج</button>
                </div>
            </div>
        </section>

        <!-- Links Section (Switchgears) -->
        <section class="switchgear-container">
            
            <a href="https://www.youtube.com/@Daniztori" target="_blank" class="switch-btn engine-start" data-rpm="120" data-gear="3">
                <div class="switch-icon"><i class="fa-brands fa-youtube"></i></div>
                <div class="switch-text">
                    <span class="title">کانال یوتیوب</span>
                    <span class="subtitle">ویدیوها و ولاگ‌ها</span>
                </div>
                <div class="switch-indicator red"></div>
            </a>

            <a href="https://t.me/daniztori" target="_blank" class="switch-btn high-beam" data-rpm="180" data-gear="5">
                <div class="switch-icon"><i class="fa-brands fa-telegram"></i></div>
                <div class="switch-text">
                    <span class="title">کانال تلگرام</span>
                    <span class="subtitle">اخبار و مطالب روزانه</span>
                </div>
                <div class="switch-indicator blue"></div>
            </a>

            <a href="https://t.me/daniztori?direct" target="_blank" class="switch-btn horn" data-rpm="250" data-gear="6">
                <div class="switch-icon"><i class="fa-solid fa-handshake"></i></div>
                <div class="switch-text">
                    <span class="title">همکاری و تبلیغات</span>
                    <span class="subtitle">تعرفه‌ها و شرایط رزرو</span>
                </div>
                <div class="switch-indicator green"></div>
            </a>

        </section>

        <!-- Footer -->
        <footer class="footer">
            <p><i class="fa-solid fa-wrench"></i> طراحی شده برای جاده‌های بی‌پایان</p>
        </footer>

    </main>

    <script src="app.js"></script>
</body>
</html>
